name: Build zh-TW dictionary candidates

on:
  push:
    branches: [localize/zh-tw-ui]
    paths:
      - '.github/workflows/zh-tw-dictionary-build.yml'
      - 'scripts/i18n/import_mit_dictionary.py'
      - 'scripts/i18n/requirements-conversion.txt'
      - 'localization/zh-TW/overrides.json'
      - 'localization/zh-TW/patches/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zh-tw-dictionary-candidates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dictionary:
    if: github.repository == 'staruphackers/n8n-zh-tw' && github.ref == 'refs/heads/localize/zh-tw-ui'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # 僅上傳下方白名單檔案的 Git blob；不移動分支、不建立 PR、不部署。
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install hash-pinned conversion tool in an isolated environment
        run: |
          python3 -m venv /tmp/zh-tw-tools
          /tmp/zh-tw-tools/bin/python -m pip install --require-hashes --only-binary=:all: --no-deps -r scripts/i18n/requirements-conversion.txt
      - name: Run offline validation tests
        run: /tmp/zh-tw-tools/bin/python -m unittest discover -s scripts/i18n -p 'test_*.py' -v
      - name: Build candidates from immutable MIT data only
        run: /tmp/zh-tw-tools/bin/python scripts/i18n/import_mit_dictionary.py --output /tmp/zh-tw-candidates --cache /tmp/zh-tw-source-cache
      - name: Upload candidate Git objects without modifying any ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          /tmp/zh-tw-tools/bin/python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          from urllib.request import Request, urlopen
          root = Path('/tmp/zh-tw-candidates')
          allowed = {
              'packages/frontend/@n8n/i18n/src/locales/zh-TW.json',
              'localization/zh-TW/overrides.json',
              'localization/zh-TW/phrase-memory.json',
              'localization/zh-TW/missing-base.json',
              'localization/zh-TW/technical-review.json',
              'localization/zh-TW/coverage.json',
              'localization/vendor/melas-v0.3.0/LICENSE',
              'localization/vendor/melas-v0.3.0/NOTICE',
              'localization/vendor/melas-v0.3.0/PROVENANCE.md',
          }
          actual = {path.relative_to(root).as_posix() for path in root.rglob('*') if path.is_file()}
          if actual != allowed:
              raise SystemExit('產物與允許的翻譯／來源文件清單不一致，停止上傳。')
          results = []
          for name in sorted(allowed):
              path = root / name
              data = path.read_bytes()
              if path.is_symlink() or len(data) > 8_000_000:
                  raise SystemExit('產物型別或大小不符合限制。')
              expected = hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()
              body = json.dumps({'content': data.decode('utf-8'), 'encoding': 'utf-8'}).encode()
              request = Request('https://api.github.com/repos/staruphackers/n8n-zh-tw/git/blobs', data=body, method='POST', headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with urlopen(request, timeout=60) as response:
                  result = json.load(response)
              if result.get('sha') != expected or not re.fullmatch('[0-9a-f]{40}', result['sha']):
                  raise SystemExit('Git blob 雜湊驗證失敗。')
              results.append({'path': name, 'mode': '100644', 'type': 'blob', 'sha': result['sha']})
          print('CANDIDATE_TREE_ELEMENTS=' + json.dumps(results, ensure_ascii=False))
          print('沒有建立 commit、移動分支或部署到主機。')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## 繁中字典候選產物\n\n已上傳 Git 物件，但尚未更新任何分支。\n\n')
              summary.write('```json\n' + json.dumps(results, ensure_ascii=False, indent=2) + '\n```\n')
          PY
